services:
  backend:
    build: ../backend
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
      MONGODB_URI: ${MONGODB_URI:?MONGODB_URI requis}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET robuste requis}
      CORS_ORIGINS: ${CORS_ORIGINS:?Origine HTTPS requise}
      SEED_DEMO: "false"
    volumes:
      - audio-files:/app/data/uploads
    expose:
      - "3000"
  frontend:
    build: ../frontend-starter
    restart: unless-stopped
    ports:
      - "127.0.0.1:8080:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - backend
volumes:
  audio-files:
